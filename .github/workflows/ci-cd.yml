name: Spring Boot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Give Maven Wrapper Permission
        run: chmod +x mvnw

      - name: Build Project
        run: ./mvnw clean package

      - name: Run Tests
        run: ./mvnw test

      - name: Build Docker Image
        run: docker build -t jobportal .