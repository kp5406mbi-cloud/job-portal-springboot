<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Recruiter Jobs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">

    <h2 class="text-primary m-0">Your Posted Jobs</h2>

    <form th:action="@{/logout}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />
        <button class="btn btn-outline-danger">Logout</button>
    </form>
</div>



<div class="mb-4">

    <a th:href="@{/recruiter/post}" class="btn btn-primary">

        <span th:text="${jobs == null or #lists.isEmpty(jobs)
                        ? 'Post Your First Job'
                        : 'Post Another Job'}">
        </span>

    </a>

</div>

<div th:if="${jobs == null or #lists.isEmpty(jobs)}">
    <p class="text-center text-muted">No jobs posted yet.</p>
</div>

<div th:each="job : ${jobs}" class="card mb-3 p-3 shadow-sm">

    <h4 th:text="${job.title}"></h4>
    <p th:text="${job.description}"></p>
    <p class="text-success fw-semibold" th:if="${job.salary != null}">
        Salary: ₹<span th:text="${job.salary / 100000}"></span> LPA
        (<span th:text="${#numbers.formatInteger(job.salary, 3, 'COMMA')}"></span>)
    </p>

    <p class="text-muted" th:if="${job.salary == null}">
        Salary: Not disclosed
    </p>

    <p class="text-muted">Location: <span th:text="${job.location}"></span></p>

    <div class="mt-3">
        <a th:href="@{/recruiter/applicants/{id}(id=${job.id})}"
           class="btn btn-outline-primary btn-sm me-2">
            View Applicants
        </a>

        <a th:href="@{/recruiter/edit/{id}(id=${job.id})}"
           class="btn btn-warning btn-sm me-2">
            Edit
        </a>

        <form th:action="@{/recruiter/delete/{id}(id=${job.id})}"
              method="post" style="display:inline;">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <button class="btn btn-danger btn-sm">
                Delete
            </button>
        </form>
    </div>



</div>

</body>
</html>
