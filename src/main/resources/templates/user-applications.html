<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Applications</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-primary text-center mb-4">
        My Applications
    </h1>

    <table class="table table-bordered table-striped">

        <thead>
        <tr>
            <th>Job Title</th>
            <th>Company</th>
            <th>Applied Date</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="app : ${applications}">

            <td th:text="${app.job.title}"></td>

            <td th:text="${app.job.company}"></td>

            <td th:text="${#temporals.format(app.appliedDate,'dd MMM yyyy')}"></td>

            <td>

                <span class="badge bg-warning"
                      th:if="${app.status == 'PENDING'}">
                    Pending
                </span>

                <span class="badge bg-success"
                      th:if="${app.status == 'ACCEPTED'}">
                    Accepted
                </span>

                <span class="badge bg-danger"
                      th:if="${app.status == 'REJECTED'}">
                    Rejected
                </span>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
