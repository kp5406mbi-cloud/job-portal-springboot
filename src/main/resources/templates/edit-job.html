<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2 class="text-center text-warning mb-4">Edit Job</h2>

<form th:action="@{/recruiter/edit/{id}(id=${job.id})}"
      method="post"
      th:object="${job}">

    <input type="text" th:field="*{title}" class="form-control mb-2" placeholder="Title"/>

    <input type="number"
           th:field="*{salary}"
           class="form-control mb-2"
           placeholder="Salary (₹ per year)" />

    <input type="text" th:field="*{location}" class="form-control mb-2" placeholder="Location"/>

    <textarea th:field="*{description}" class="form-control mb-2" placeholder="Description"></textarea>

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}" />

    <button class="btn btn-warning">Update Job</button>

</form>

</body>
</html>
