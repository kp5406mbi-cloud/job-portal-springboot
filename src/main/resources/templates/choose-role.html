<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Select Role</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background: linear-gradient(
                    135deg,
                    #667eea 0%,
                    #764ba2 100%
            );

            overflow:hidden;
        }

        body::before{
            content:'';
            position:absolute;
            width:500px;
            height:500px;
            background:rgba(255,255,255,0.08);
            border-radius:50%;
            top:-150px;
            left:-150px;
        }

        body::after{
            content:'';
            position:absolute;
            width:500px;
            height:500px;
            background:rgba(255,255,255,0.08);
            border-radius:50%;
            bottom:-150px;
            right:-150px;
        }

        .card{
            background:white;
            width:700px;
            max-width:90%;

            padding:50px;

            border-radius:24px;

            box-shadow:
                    0 20px 50px rgba(0,0,0,0.15);

            text-align:center;

            position:relative;
            z-index:1;
        }

        .icon{
            width:90px;
            height:90px;

            margin:auto;
            margin-bottom:20px;

            border-radius:50%;

            background:#eef2ff;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:40px;
        }

        h1{
            color:#1f2937;
            margin-bottom:10px;
        }

        .subtitle{
            color:#6b7280;
            margin-bottom:35px;
        }

        .roles{
            display:flex;
            gap:20px;
            justify-content:center;
            flex-wrap:wrap;
        }

        .role-form{
            flex:1;
            min-width:220px;
        }

        .role-btn{

            width:100%;
            border:none;
            background:white;

            border-radius:18px;
            padding:30px;

            cursor:pointer;

            transition:0.3s ease;

            border:2px solid #e5e7eb;
        }

        .role-btn:hover{
            transform:translateY(-6px);
            box-shadow:0 12px 25px rgba(0,0,0,0.12);
        }

        .jobseeker{
            border-color:#93c5fd;
        }

        .recruiter{
            border-color:#c4b5fd;
        }

        .role-icon{
            font-size:42px;
            margin-bottom:15px;
        }

        .role-title{
            font-size:22px;
            font-weight:600;
            color:#111827;
            margin-bottom:10px;
        }

        .role-desc{
            color:#6b7280;
            font-size:14px;
        }

    </style>
</head>

<body>

<div class="card">

    <div class="icon">👥</div>

    <h1>Select Account Type</h1>

    <p class="subtitle">
        Choose how you want to continue
    </p>

    <div class="roles">

        <form th:action="@{/choose-role}"
              method="post"
              class="role-form">

            <input type="hidden"
                   name="role"
                   value="USER">

            <button type="submit"
                    class="role-btn jobseeker">

                <div class="role-icon">💼</div>

                <div class="role-title">
                    Job Seeker
                </div>

                <div class="role-desc">
                    Find jobs and build your career
                </div>

            </button>
        </form>

        <form th:action="@{/choose-role}"
              method="post"
              class="role-form">

            <input type="hidden"
                   name="role"
                   value="RECRUITER">

            <button type="submit"
                    class="role-btn recruiter">

                <div class="role-icon">🏢</div>

                <div class="role-title">
                    Recruiter
                </div>

                <div class="role-desc">
                    Post jobs and hire talent
                </div>

            </button>

        </form>

    </div>

</div>

</body>
</html>
