<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        h2 {
            margin-bottom: 20px;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

<div class="login-box">

    <h2>Job Portal Login</h2>

    <!-- ✅ FIXED FORM -->
    <form th:action="@{/login}" method="post">

        <input type="email" name="username" placeholder="Email">

        <input type="password" name="password" placeholder="Password">

        <button type="submit">Login</button>

    </form>

    <hr>

    <a href="/oauth2/authorization/google">
        <button type="button" style="background:#db4437;">
            Sign in with Google
        </button>
    </a>

    <p class="error" th:if="${param.error != null}">
        Invalid credentials
    </p>

    <p th:if="${param.logout != null}">
        Logged out successfully
    </p>

    <div style="margin-top: 10px;">
        <small>
            Don't have an account?
            <a href="/register">Register here</a>
        </small>
    </div>

</div>

</body>
</html>
