<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Jobs</title>

</head>

<body class="bg-light">

<div class="container mt-4">

    <!-- HEADER (already fixed) -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold">Available Jobs</h2>

        <div class="d-flex align-items-center gap-3">
            <span class="text-muted">
                Logged in as <strong th:text="${username}"></strong>
            </span>

            <a href="/logout" class="btn btn-outline-danger btn-sm">
                Logout
            </a>
        </div>
    </div>

<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<div th:if="${jobs == null or #lists.isEmpty(jobs)}" class="text-center mt-5">

    <h4 class="text-muted">No jobs available</h4>

    <p class="text-secondary">
        🚀 Check back later for new openings
    </p>

</div>

<div th:each="job : ${jobs}" class="card mb-3 p-4 shadow-sm">

    <h6 class="text-muted mb-1" th:text="${job.company}"></h6>
    <h4 class="fw-bold" th:text="${job.title}"></h4>

    <p class="text-muted mb-2" th:text="${job.description}"></p>

    <!-- Salary + Location -->
    <p class="mb-1">
        <strong>Salary:</strong>
        <span th:text="${job.salary != null ? job.salary / 100000 : 'Not disclosed'}"></span>
        <span th:if="${job.salary != null}"> LPA</span>
    </p>

    <div class="text-muted mb-3">
        <strong>Location:</strong> <span th:text="${job.location}"></span>
    </div>

    <!-- Already Applied -->
    <div th:if="${appliedJobIds != null and appliedJobIds.contains(job.id)}">
        <button class="btn btn-success px-4" disabled>
             Already Applied
        </button>
    </div>

    <!-- Not Applied -->
    <div th:unless="${appliedJobIds != null and appliedJobIds.contains(job.id)}">

        <form th:action="@{/apply/{id}(id=${job.id})}"
              method="post"
              enctype="multipart/form-data">



            <label class="form-label fw-semibold">Upload Resume</label>

            <input type="file" name="file"
                   class="form-control mb-2"
                   accept=".pdf,.doc,.docx"
                   required>

            <small class="text-muted d-block mb-2">
                Only PDF/DOC allowed
            </small>

            <button type="submit" class="btn btn-primary px-4">
                Upload & Apply
            </button>

        </form>

    </div>

</div>

</body>
