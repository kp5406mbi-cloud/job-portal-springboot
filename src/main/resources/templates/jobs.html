<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Jobs</title>

</head>

<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">

    <h1 class="text-primary m-0">Available Jobs</h1>
    <div class="d-flex align-items-center gap-3">

        <span class="text-muted">
            Logged in as <b th:text="${username}"></b>
        </span>
    </div>

    <form th:action="@{/logout}" method="post">
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />
        <button class="btn btn-outline-danger">Logout</button>
    </form>

</div>

<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<div th:if="${jobs == null or #lists.isEmpty(jobs)}" class="text-center mt-5">

    <h4 class="text-muted">No jobs available</h4>

    <p class="text-secondary">
        🚀 Check back later for new openings
    </p>

</div>

<div th:each="job : ${jobs}" class="card mb-3 p-4 shadow-sm">

    <h6 class="text-muted mb-1" th:text="${job.company}"></h6>
    <h4 class="fw-bold" th:text="${job.title}"></h4>

    <p class="text-muted mb-2" th:text="${job.description}"></p>

    <!-- Salary + Location -->
    <div class="text-muted mb-2">
        <span th:text="${job.salary != null ? job.salary / 100000 : 'Not disclosed'}"></span>
    </div>

    <div class="text-muted mb-3">
        <strong>Location:</strong> <span th:text="${job.location}"></span>
    </div>

    <!-- Already Applied -->
    <div th:if="${appliedJobIds != null and appliedJobIds.contains(job.id)}">
        <button class="btn btn-success px-4" disabled>
             Already Applied
        </button>
    </div>

    <!-- Not Applied -->
    <div th:unless="${appliedJobIds != null and appliedJobIds.contains(job.id)}">

        <form th:action="@{/apply/{id}(id=${job.id})}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <label class="form-label fw-semibold">Upload Resume</label>

            <input type="file" name="file"
                   class="form-control mb-2"
                   accept=".pdf,.doc,.docx"
                   required>

            <small class="text-muted d-block mb-2">
                Only PDF/DOC allowed
            </small>

            <button type="submit" class="btn btn-primary px-4">
                Upload & Apply
            </button>

        </form>

    </div>

</div>

</body>
