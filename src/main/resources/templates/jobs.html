<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Jobs</title>

</head>

<body class="container mt-5">

<h1 class="text-center text-primary mb-4">Available Jobs</h1>

<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

<div th:each="job : ${jobs}" class="card mb-3 p-3 shadow-sm">

    <h4 th:text="${job.title}"></h4>
    <p th:text="${job.description}"></p>

    <!-- Already applied -->
    <div th:if="${appliedJobIds.contains(job.id)}">
        <button class="btn btn-success" disabled>Already Applied</button>
    </div>

    <!-- Not applied -->
    <div th:unless="${appliedJobIds.contains(job.id)}">

        <form th:action="@{/apply/{id}(id=${job.id})}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <label class="form-label fw-semibold">Upload Resume</label>

            <input type="file" name="file"
                   class="form-control mb-2"
                   accept=".pdf,.doc,.docx"
                   required>

            <small class="text-muted">Only PDF/DOC allowed</small>

            <button type="submit" class="btn btn-primary">
                Upload & Apply
            </button>

        </form>

    </div>

</div>
