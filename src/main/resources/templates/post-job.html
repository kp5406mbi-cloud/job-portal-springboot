<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Post Job</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- Back Button -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <!-- Left: Back -->
        <a href="/recruiter/jobs" class="btn btn-outline-secondary">
            ← Back
        </a>

        <!-- Center: Title -->
        <h2 class="text-primary fw-bold mx-auto ">
            Post a New Job
        </h2>

        <!-- Right: empty (for balance) -->
        <div style="width: 80px;"></div>

    </div>

    <!-- Form Card -->
    <div class="card shadow-sm p-4 mx-auto border-0" style="max-width: 700px;">

        <form th:action="@{/recruiter/post}" method="post">

            <!-- CSRF -->
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <!-- Job Title -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Job Title</label>
                <input type="text"
                       name="title"
                       class="form-control"
                       placeholder="e.g. Software Engineer"
                       required>
            </div>

            <!-- Salary -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Salary (₹ per year)</label>
                <input type="number"
                       name="salary"
                       class="form-control"
                       placeholder="e.g. 1000000"
                       required>
            </div>

            <!-- Location -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Location</label>
                <input type="text"
                       name="location"
                       class="form-control"
                       placeholder="e.g. Bangalore"
                       required>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label class="form-label fw-semibold">Description</label>
                <textarea name="description"
                          class="form-control"
                          rows="4"
                          placeholder="Enter job description..."
                          required></textarea>
            </div>

            <!-- Submit Button -->
            <div class="d-grid">
                <button type="submit" class="btn btn-primary py-2">
                    Post Job
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
