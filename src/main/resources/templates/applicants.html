<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Applicants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">

<h2 class="text-primary mb-4 text-center">Applicants</h2>

<a href="/recruiter/jobs" class="btn btn-secondary mb-3">
    ← Back to Jobs
</a>

<!-- Empty State -->
<div th:if="${applications == null or #lists.isEmpty(applications)}"
     class="text-center mt-5">

    <h5 class="text-muted">No applicants yet</h5>
    <p class="text-secondary">Once users apply, they will appear here.</p>

</div>

<!-- Applicants List -->
<div th:each="app : ${applications}" class="card p-4 shadow-sm mb-4">

    <!-- Email -->
    <p class="mb-2">
        <strong>Email:</strong>
        <span th:text="${app.userEmail}"></span>
    </p>

    <!-- Applied Date -->
    <p class="mb-2">
        <strong>Applied On:</strong>
        <span th:text="${#temporals.format(app.appliedDate, 'dd MMM yyyy')}"></span>
    </p>

    <!-- Status -->
    <p class="mb-3">
        <strong>Status:</strong>

        <span class="badge px-3 py-2 ms-2"
              th:classappend="
                ${app.status == 'ACCEPTED'} ? 'bg-success' :
                (${app.status == 'REJECTED'} ? 'bg-danger' : 'bg-warning text-dark')">

            <span th:text="${app.status == null ? 'PENDING' : app.status}"></span>

        </span>
    </p>

    <!-- Bottom Section -->
    <div class="d-flex justify-content-between align-items-center">

        <!-- Resume -->
        <a th:href="@{/resume/{id}(id=${app.id})}"
           class="btn btn-outline-primary btn-sm">
            Download Resume
        </a>

        <!-- Actions -->
        <div th:if="${app.status == null or app.status == 'PENDING'}">

            <form th:action="@{/recruiter/application/{id}/accept(id=${app.id})}"
                  method="post" style="display:inline;">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />
                <button class="btn btn-success btn-sm">Accept</button>
            </form>

            <form th:action="@{/recruiter/application/{id}/reject(id=${app.id})}"
                  method="post" style="display:inline;">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />
                <button class="btn btn-danger btn-sm">Reject</button>
            </form>

        </div>

    </div>

</div>

</body>
</html>
