<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            text-align: center;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
             box-sizing: border-box;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        h2 {
            margin-bottom: 15px;
        }

        a {
            color: #667eea;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .error {
            color: red;
        }

        .role-toggle {
    display: flex;
    gap: 10px;
    margin: 15px 0;
}

.role-toggle label {
    flex: 1;
    cursor: pointer;
}

.role-toggle input {
    display: none;
}

.role-toggle span {
    display: block;
    padding: 10px;
    border: 2px solid #667eea;
    border-radius: 6px;
    text-align: center;
    transition: 0.3s;
}

/* selected */
.role-toggle input:checked + span {
    background: #667eea;
    color: white;
}
    </style>
</head>

<body>

<div class="login-box">

    <h2>Register</h2>

    <p class="error" th:if="${error}" th:text="${error}"></p>

    <form th:action="@{/register}" method="post">

        <p>
            Already have an account?
            <a href="/login">Login here</a>
        </p>

        <input type="email" name="email" placeholder="Email">

        <input type="password" name="password" placeholder="Password">

        <div class="role-toggle">
            <label>
                <input type="radio" name="role" value="USER" required>
                <span>Job Seeker</span>
            </label>

            <label>
                <input type="radio" name="role" value="RECRUITER">
                <span>Recruiter</span>
            </label>
        </div>

        <button type="submit">Register</button>

    </form>

</div>

</body>
</html>
